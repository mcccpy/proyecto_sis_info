services:
  postgres:
    image: postgres:17-alpine
    container_name: arreglaya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arreglaya
      POSTGRES_PASSWORD: arreglaya_local
      POSTGRES_DB: arreglaya
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - arreglaya_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arreglaya -d arreglaya"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  arreglaya_pgdata:
